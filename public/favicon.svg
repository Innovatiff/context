<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="14" fill="#1c1917"/>
  <!-- distribution curve: where most people are -->
  <path d="M10 46 C21 46 25 16 32 16 C39 16 43 46 54 46" fill="none" stroke="#2dd4bf" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- baseline -->
  <path d="M9 46 H55" stroke="#2dd4bf" stroke-width="2.4" stroke-linecap="round" opacity="0.4"/>
  <!-- "you are here": a single marked point on the curve -->
  <path d="M41 46 V30" stroke="#f59e0b" stroke-width="2.4" stroke-linecap="round" opacity="0.85"/>
  <circle cx="41" cy="27" r="4.6" fill="#f59e0b"/>
</svg>
